<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение для любимой Мамы</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(255, 154, 162, 0.2);
            --accent-color: #ff6b81;
            --accent-hover: #ff4757;
            --text-main: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 {
            width: 260px;
            height: 260px;
            background: #ff9a9e;
            top: 5%;
            left: 5%;
        }
        .blob-2 {
            width: 320px;
            height: 320px;
            background: #fecfef;
            bottom: 5%;
            right: 5%;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.1); }
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 28px;
            box-shadow: var(--glass-shadow);
        }

        .header-subtitle {
            text-align: center;
            font-size: 14px;
            color: #636e72;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #4b6584;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .datetime-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-glass {
            flex: 1;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-glass:focus {
            background: rgba(255, 255, 255, 0.85);
            border-color: var(--accent-color);
        }

        .places-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 9px 14px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.65);
        }

        .chip.selected {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.35);
            transform: scale(1.02);
        }

        textarea.input-glass {
            width: 100%;
            height: 90px;
            resize: none;
            margin-bottom: 24px;
        }

        .buttons-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 18px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 4px 14px rgba(255, 107, 129, 0.35);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.45);
            color: #57606f;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.65);
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen.active {
            display: block;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .result-item {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 15px;
            text-align: left;
        }

        .result-item span {
            font-weight: 600;
            color: #747d8c;
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="card">
        <div id="form-screen">
            <div class="header-subtitle">Приглашение</div>
            <h1>Для любимой Мамы 🌸</h1>

            <div class="section-title">Выбери удобный день и время:</div>
            <div class="datetime-group">
                <input type="date" id="dateInput" class="input-glass">
                <input type="time" id="timeInput" class="input-glass">
            </div>

            <div class="section-title">Куда отправимся?</div>
            <div class="places-grid" id="placesGrid">
                <div class="chip" data-place="☕ Уютное кафе">☕ Уютное кафе</div>
                <div class="chip" data-place="🍕 Семейный ресторан">🍕 Семейный ресторан</div>
                <div class="chip" data-place="🌳 Прогулка в парке">🌳 Прогулка в парке</div>
                <div class="chip" data-place="🎭 Театр / Концерт">🎭 Театр / Концерт</div>
                <div class="chip" data-place="🛍️️ Совместный шопинг">🛍️ Совместный шопинг</div>
                <div class="chip" data-place="🍰 Домашний уютный вечер">🍰 Домашний вечер</div>
            </div>

            <div class="section-title">Пожелания или комментарии</div>
            <textarea id="commentInput" class="input-glass" placeholder="Напиши, что захватить или куда бы ты хотела зайти..."></textarea>

            <div class="buttons-group">
                <button class="btn btn-primary" onclick="submitForm(true)">С удовольствием! 💖</button>
                <button class="btn btn-secondary" onclick="submitForm(false)">Выберу другой день</button>
            </div>
        </div>

        <div id="result-screen" class="result-screen">
            <div id="result-content"></div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8661747024:AAFnK4oqN3_birAz3WV7cWOZpilyNrlJQUc';
        const CHAT_ID = '8157788321';

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('selected');
            });
        });

        function sendTelegramNotification(messageText) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: messageText,
                    parse_mode: 'HTML'
                })
            }).catch(err => console.log('Ошибка:', err));
        }

        function submitForm(accepted) {
            const date = document.getElementById('dateInput').value;
            const time = document.getElementById('timeInput').value;
            const comment = document.getElementById('commentInput').value.trim();
            
            const selectedPlaces = Array.from(document.querySelectorAll('.chip.selected'))
                .map(c => c.getAttribute('data-place'));

            const formScreen = document.getElementById('form-screen');
            const resultScreen = document.getElementById('result-screen');
            const resultContent = document.getElementById('result-content');

            if (accepted) {
                if (!date || !time) {
                    alert('Мамуль, выбери, пожалуйста, дату и время! ❤️');
                    return;
                }
                if (selectedPlaces.length === 0) {
                    alert('Выбери хотя бы одно место! ✨');
                    return;
                }

                const tgText = `🌸 <b>Мама приняла приглашение!</b> 💖\n\n` +
                    `📅 <b>Дата:</b> ${date}\n` +
                    `⏰ <b>Время:</b> ${time}\n` +
                    `📍 <b>Выбранные варианты:</b>\n${selectedPlaces.map(p => `• ${p}`).join('\n')}\n` +
                    (comment ? `💬 <b>Пожелания:</b> ${comment}` : '');
                
                sendTelegramNotification(tgText);

                resultContent.innerHTML = `
                    <div class="result-title">Ура! Жду с нетерпением! 💖</div>
                    <div class="result-item"><span>Дата и время</span>${date} в ${time}</div>
                    <div class="result-item"><span>Планируем</span>${selectedPlaces.join(', ')}</div>
                    ${comment ? `<div class="result-item"><span>Заметка</span>${comment}</div>` : ''}
                `;
            } else {
                const tgText = `🌺 <b>Мама попросила выбрать другой день</b>\n` + 
                    (comment ? `💬 <b>Комментарий:</b> ${comment}` : '');
                
                sendTelegramNotification(tgText);

                resultContent.innerHTML = `
                    <div class="result-title">Понял, подстроимся! 🌸</div>
                    <p style="color: #57606f; font-size: 15px;">Ничего страшного, обязательно выберем другой удобный день!</p>
                `;
            }

            formScreen.style.display = 'none';
            resultScreen.classList.add('active');
        }
    </script>
</body>
</html>
